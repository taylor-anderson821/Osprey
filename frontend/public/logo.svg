<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1e40af" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Osprey bird silhouette -->
  <g fill="#60a5fa">
    <!-- Body -->
    <ellipse cx="50" cy="55" rx="8" ry="12"/>
    
    <!-- Head -->
    <circle cx="50" cy="40" r="6"/>
    
    <!-- Beak -->
    <path d="M 50 37 L 52 34 L 50 35 Z" fill="#fbbf24"/>
    
    <!-- Left wing -->
    <path d="M 42 50 Q 25 45 20 50 Q 25 52 42 55 Z" />
    
    <!-- Right wing -->
    <path d="M 58 50 Q 75 45 80 50 Q 75 52 58 55 Z" />
    
    <!-- Tail -->
    <path d="M 50 67 L 45 75 L 50 73 L 55 75 Z" />
  </g>
  
  <!-- Eye -->
  <circle cx="52" cy="39" r="1.5" fill="#1e293b"/>
  
  <!-- Accent lines for wing detail -->
  <path d="M 30 48 Q 35 50 40 52" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 70 48 Q 65 50 60 52" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.6"/>
</svg>
